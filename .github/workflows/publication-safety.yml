name: publication-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publication-safety:
    name: publication-safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed tree and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version | grep -qx '8.30.1'
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/publication-gitleaks.toml"
          : > "$RUNNER_TEMP/publication-gitleaksignore"
      - name: Verify pinned Gitleaks detects a synthetic canary
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-bin/gitleaks
        run: python3 .github/scripts/gitleaks_canary.py
      - name: Test scanner with synthetic canaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check tracked files for local paths and internal IPs
        run: python3 .github/scripts/publication_safety.py
      - name: Scan Git history for secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/publication-gitleaks.log" "$RUNNER_TEMP/publication-gitleaks.json"' EXIT
          if "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --no-banner --redact=100 --log-level error \
              --config "$RUNNER_TEMP/publication-gitleaks.toml" \
              --gitleaks-ignore-path "$RUNNER_TEMP/publication-gitleaksignore" \
              --ignore-gitleaks-allow --log-opts=--all \
              --report-format json --report-path "$RUNNER_TEMP/publication-gitleaks.json" . \
              >"$RUNNER_TEMP/publication-gitleaks.log" 2>&1; then
            echo 'Gitleaks history scan passed.'
          else
            echo 'Gitleaks history scan failed or could not complete; details withheld.'
            exit 1
          fi
